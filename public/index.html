<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeoVODS — Kick VOD Downloader</title>
<meta name="description" content="LeoVODS — paste a Kick VOD link, pick a quality, download. Free, no sign-up.">
<link rel="stylesheet" href="/styles.css?v=10">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232E9BFF'/><text x='50' y='68' font-size='55' text-anchor='middle' font-weight='900' fill='%2306233D'>L</text></svg>">
</head>
<body class="landing">
<canvas id="bg"></canvas>
<div class="cursor-glow" id="glow"></div>
<div class="cursor-dot" id="cdot"></div>

<header class="mini-nav">
  <div class="logo"><div class="logo-mark">L</div> LeoVODS</div>
  <div style="display:flex;gap:8px">
    <a class="btn btn-ghost btn-sm" href="/messages">💬 Message Generator</a>
    <a class="btn btn-ghost btn-sm" href="/yt">▶ YouTube ↓</a>
    <a class="btn btn-primary btn-sm" href="/app">Open Toolkit →</a>
  </div>
</header>

<main class="stage">
  <div class="glass dl-card">
    <div class="eyebrow">LeoVODS</div>
    <h1>Kick VOD Downloader</h1>
    <p class="sub">Paste a link. Pick a quality. Download.</p>
    <div class="dl-row">
      <input id="url" placeholder="https://kick.com/channel/videos/…" spellcheck="false" autocomplete="off">
      <button class="btn btn-primary" id="fetchBtn">Fetch</button>
    </div>
    <div class="quality-row" id="qRow" style="display:none">
      <button class="q" data-q="best">Best</button>
      <button class="q" data-q="1080p60">1080p60</button>
      <button class="q" data-q="720p60">720p60</button>
      <button class="q" data-q="480p">480p</button>
      <button class="q" data-q="360p">360p</button>
      <button class="q" data-q="160p">160p</button>
    </div>
    <div class="spinner" id="spin">⏳ Reading VOD info…</div>
    <div class="err" id="err"></div>
    <div class="result" id="result">
      <div class="result-top">
        <img id="rThumb" alt="thumbnail">
        <div>
          <h3 id="rTitle"></h3>
          <div class="meta"><span id="rChan"></span><span id="rDur"></span><span id="rViews"></span></div>
          <div class="dl-actions">
            <button class="btn btn-primary btn-sm" id="dlMp4">⬇ MP4</button>
            <button class="btn btn-sm" id="dlMp3">♫ MP3</button>
            <button class="btn btn-ghost btn-sm" id="copyM3u8">Copy m3u8</button>
            <button class="btn btn-ghost btn-sm" id="openKick">Open on Kick ↗</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <p class="hint">Free • No sign-up • 1080p60 MP4 + MP3</p>
</main>

<div class="toast" id="toast"></div>
<script src="/landing.js?v=10"></script>
<script src="/bg.js?v=10"></script>
</body>
</html>
